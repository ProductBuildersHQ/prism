name: Go SAST (CodeQL)
permissions:
  actions: read
  contents: read
  security-events: write
on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-sast-codeql.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-sast-codeql.yaml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: go
        queries: security-extended,security-and-quality

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'

    - name: Build analyzable packages
      run: |
        PACKAGES=$(go list ./... | grep -v -E '(doltstore|cmd/)')
        go build $PACKAGES

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:go"
