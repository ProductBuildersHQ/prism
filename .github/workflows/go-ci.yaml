name: Go CI
permissions:
  contents: read
on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-ci.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-ci.yaml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x"]
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    name: test (${{ matrix.go-version }}, ${{ matrix.platform }})
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Run tests
      run: |
        PACKAGES=$(go list ./... | grep -v -E '(doltstore|cmd/)')
        go test -v -covermode=count $PACKAGES
